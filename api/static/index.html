<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OKF Knowledge Store</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0a0a0f;
            --text-primary: #ffffff;
            --text-secondary: #9ca3af;
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --secondary: #818cf8;
            --success: #22c55e;
            --error: #ef4444;
            --card-bg: rgba(255, 255, 255, 0.05);
            --card-border: rgba(255, 255, 255, 0.1);
            --glass-blur: 12px;
            --radius: 16px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(99, 102, 241, 0.15), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(129, 140, 248, 0.15), transparent 25%);
            background-attachment: fixed;
        }

        /* Utility Classes */
        .hidden { display: none !important; }
        .glass-card {
            background: var(--card-bg);
            backdrop-filter: blur(var(--glass-blur));
            -webkit-backdrop-filter: blur(var(--glass-blur));
            border: 1px solid var(--card-border);
            border-radius: var(--radius);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            transition: var(--transition);
        }
        .glass-card:hover {
            border-color: rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.4);
        }

        /* Animations */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .fade-in { animation: fadeIn 0.5s ease forwards; }
        .slide-up { animation: slideUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

        /* Typography */
        h1, h2, h3, h4 { font-weight: 600; line-height: 1.2; }
        h1 { font-size: 2.5rem; letter-spacing: -0.02em; }
        h2 { font-size: 1.5rem; }
        h3 { font-size: 1.1rem; }
        p { color: var(--text-secondary); line-height: 1.6; }

        /* Forms & Inputs */
        input {
            width: 100%;
            padding: 12px 16px;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            color: white;
            font-family: inherit;
            font-size: 1rem;
            transition: var(--transition);
        }
        input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.2);
        }
        input::placeholder { color: #6b7280; }

        button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 12px 24px;
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 500;
            font-size: 1rem;
            cursor: pointer;
            transition: var(--transition);
            font-family: inherit;
        }
        button:hover { background: var(--accent-hover); transform: translateY(-1px); }
        button:active { transform: translateY(0); }
        button:disabled { opacity: 0.7; cursor: not-allowed; }
        
        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
        }
        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        /* Layout */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
            width: 100%;
        }

        /* Auth Page */
        #auth-page {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }
        .auth-container {
            width: 100%;
            max-width: 400px;
            padding: 2.5rem;
        }
        .auth-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .auth-logo {
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--secondary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }
        .auth-tabs {
            display: flex;
            gap: 1rem;
            margin-bottom: 1.5rem;
            border-bottom: 1px solid var(--card-border);
            padding-bottom: 1rem;
        }
        .auth-tab {
            flex: 1;
            text-align: center;
            padding: 0.5rem;
            cursor: pointer;
            color: var(--text-secondary);
            font-weight: 500;
            transition: var(--transition);
            position: relative;
        }
        .auth-tab.active {
            color: var(--text-primary);
        }
        .auth-tab.active::after {
            content: '';
            position: absolute;
            bottom: -1rem;
            left: 0;
            width: 100%;
            height: 2px;
            background: var(--accent);
            border-radius: 2px 2px 0 0;
        }
        .auth-form {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        .error-message {
            color: var(--error);
            font-size: 0.875rem;
            text-align: center;
            min-height: 20px;
        }

        /* Dashboard */
        #dashboard-page {
            display: flex;
            flex-direction: column;
            flex: 1;
        }
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem 2rem;
            background: rgba(10, 10, 15, 0.8);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--card-border);
            position: sticky;
            top: 0;
            z-index: 40;
        }
        .brand {
            font-weight: 700;
            font-size: 1.25rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .brand-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--accent);
            box-shadow: 0 0 10px var(--accent);
        }
        .user-nav {
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }
        .username-display {
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        /* Dashboard Content */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
            margin-bottom: 3rem;
        }
        .stat-card {
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        .stat-label {
            color: var(--text-secondary);
            font-size: 0.875rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .stat-value {
            font-size: 2rem;
            font-weight: 700;
        }

        .search-section {
            margin-bottom: 3rem;
            position: relative;
        }
        .search-input-wrapper {
            position: relative;
            max-width: 800px;
            margin: 0 auto;
        }
        .search-input {
            width: 100%;
            padding: 1.25rem 1.25rem 1.25rem 3rem;
            font-size: 1.1rem;
            background: var(--card-bg);
            backdrop-filter: blur(var(--glass-blur));
            border-radius: 24px;
        }
        .search-icon {
            position: absolute;
            left: 1.25rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
        }

        .content-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 2rem;
        }

        @media (max-width: 900px) {
            .content-grid { grid-template-columns: 1fr; }
        }

        .section-header {
            margin-bottom: 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Cards Lists */
        .card-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        .node-card {
            padding: 1.5rem;
            cursor: pointer;
        }
        .node-card:hover {
            transform: translateY(-2px);
        }
        .node-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 0.75rem;
        }
        .node-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--text-primary);
        }
        .node-desc {
            font-size: 0.9rem;
            margin-bottom: 1rem;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .node-meta {
            display: flex;
            gap: 0.75rem;
            align-items: center;
            flex-wrap: wrap;
        }
        .badge {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 500;
            background: rgba(255, 255, 255, 0.1);
        }
        .badge-topic { background: rgba(99, 102, 241, 0.15); color: var(--secondary); border: 1px solid rgba(99, 102, 241, 0.3); }
        .badge-tag { background: rgba(255, 255, 255, 0.05); color: var(--text-secondary); }
        .badge-type { background: rgba(34, 197, 94, 0.15); color: var(--success); border: 1px solid rgba(34, 197, 94, 0.3); }

        .rank-bar {
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            margin-top: 1rem;
            overflow: hidden;
        }
        .rank-fill {
            height: 100%;
            background: var(--accent);
            width: 0%;
        }

        /* Topics Grid */
        .topics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 1rem;
        }
        .topic-card {
            padding: 1.25rem;
            text-align: center;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            align-items: center;
            justify-content: center;
        }
        .topic-name { font-weight: 500; }
        .topic-count { font-size: 0.8rem; color: var(--text-secondary); }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 2rem;
            overflow-y: auto;
            opacity: 0;
            pointer-events: none;
            transition: var(--transition);
        }
        .modal-overlay.active {
            opacity: 1;
            pointer-events: all;
        }
        .modal-content {
            width: 100%;
            max-width: 900px;
            margin-top: 2rem;
            position: relative;
            transform: translateY(20px);
            transition: var(--transition);
        }
        .modal-overlay.active .modal-content {
            transform: translateY(0);
        }
        .modal-close {
            position: absolute;
            top: 1.5rem;
            right: 1.5rem;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
        }
        .modal-close:hover { background: rgba(255, 255, 255, 0.2); }
        .modal-body {
            padding: 2.5rem;
        }
        .modal-title {
            font-size: 2rem;
            margin-bottom: 1rem;
            padding-right: 2rem;
        }
        .modal-meta-row {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            margin-bottom: 2rem;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid var(--card-border);
        }
        .modal-source-info {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-bottom: 1.5rem;
        }
        .modal-text-content {
            white-space: pre-wrap;
            line-height: 1.7;
            font-size: 1.05rem;
            color: rgba(255, 255, 255, 0.9);
        }

        /* Loaders & States */
        .spinner {
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        .loading-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 4rem 2rem;
            color: var(--text-secondary);
            gap: 1rem;
        }
        .loading-state .spinner {
            width: 40px;
            height: 40px;
            border-color: rgba(99, 102, 241, 0.3);
            border-top-color: var(--accent);
        }
        .empty-state {
            text-align: center;
            padding: 4rem 2rem;
            color: var(--text-secondary);
            background: var(--card-bg);
            border-radius: var(--radius);
            border: 1px dashed var(--card-border);
        }

        /* Skeletons */
        .skeleton {
            background: linear-gradient(90deg, rgba(255,255,255,0.05) 25%, rgba(255,255,255,0.1) 50%, rgba(255,255,255,0.05) 75%);
            background-size: 200% 100%;
            animation: skeleton-loading 1.5s infinite;
            border-radius: 4px;
        }
        @keyframes skeleton-loading {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
        .skeleton-text { height: 1em; margin-bottom: 0.5rem; }
        .skeleton-title { height: 1.5em; width: 70%; margin-bottom: 1rem; }
    </style>
</head>
<body>

<script>
    // --- Configuration ---
    const API_BASE = '';
    const API_KEY = '';

    // --- State ---
    let state = {
        token: localStorage.getItem('okf_token') || null,
        username: localStorage.getItem('okf_username') || null,
        activeTab: 'login', // 'login' or 'register'
        searchQuery: '',
        searchTimeout: null,
    };
</script>

<!-- Auth Page -->
<div id="auth-page" class="fade-in">
    <div class="auth-container glass-card slide-up">
        <div class="auth-header">
            <div class="auth-logo">OKF</div>
            <p>Knowledge Store</p>
        </div>
        
        <div class="auth-tabs">
            <div class="auth-tab active" onclick="switchAuthTab('login')" id="tab-login">Login</div>
            <div class="auth-tab" onclick="switchAuthTab('register')" id="tab-register">Register</div>
        </div>

        <form id="auth-form" class="auth-form" onsubmit="handleAuth(event)">
            <input type="text" id="auth-username" placeholder="Username" required autocomplete="username">
            <input type="password" id="auth-password" placeholder="Password" required autocomplete="current-password">
            <div id="auth-error" class="error-message"></div>
            <button type="submit" id="auth-submit">
                <span id="auth-submit-text">Login</span>
                <div id="auth-submit-spinner" class="spinner hidden" style="margin-left: 10px;"></div>
            </button>
        </form>
    </div>
</div>

<!-- Dashboard Page -->
<div id="dashboard-page" class="hidden">
    <div class="top-bar">
        <div class="brand">
            <div class="brand-dot"></div>
            OKF Knowledge Store
        </div>
        <div class="user-nav">
            <span class="username-display" id="display-username"></span>
            <button class="btn-secondary" style="padding: 8px 16px; font-size: 0.9rem;" onclick="logout()">Logout</button>
        </div>
    </div>

    <div class="container fade-in">
        <!-- Stats -->
        <div class="stats-grid" id="stats-container">
            <div class="stat-card glass-card skeleton">
                <div class="skeleton-text" style="width: 50%;"></div>
                <div class="skeleton-text" style="width: 80%; height: 2rem;"></div>
            </div>
            <div class="stat-card glass-card skeleton">
                <div class="skeleton-text" style="width: 50%;"></div>
                <div class="skeleton-text" style="width: 80%; height: 2rem;"></div>
            </div>
            <div class="stat-card glass-card skeleton">
                <div class="skeleton-text" style="width: 50%;"></div>
                <div class="skeleton-text" style="width: 80%; height: 2rem;"></div>
            </div>
        </div>

        <!-- Search -->
        <div class="search-section">
            <div class="search-input-wrapper">
                <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                <input type="text" class="search-input" id="search-input" placeholder="Search knowledge base..." oninput="handleSearch(event)">
            </div>
        </div>

        <div class="content-grid">
            <!-- Main Content Area (Search Results or Recent) -->
            <div class="main-column">
                <div class="section-header">
                    <h2 id="main-list-title">Recently Added</h2>
                </div>
                <div id="main-list-container" class="card-list">
                    <!-- Dynamic Content -->
                </div>
            </div>

            <!-- Sidebar (Topics) -->
            <div class="sidebar">
                <div class="section-header">
                    <h2>Browse Topics</h2>
                </div>
                <div id="topics-container" class="topics-grid">
                    <!-- Dynamic Content -->
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Node Detail Modal -->
<div id="node-modal" class="modal-overlay" onclick="closeModal(event)">
    <div class="modal-content glass-card" onclick="event.stopPropagation()">
        <button class="modal-close" onclick="closeModal()">&times;</button>
        <div class="modal-body" id="modal-body-content">
            <!-- Dynamic Content -->
        </div>
    </div>
</div>

<script>
    // --- Initialization ---
    document.addEventListener('DOMContentLoaded', () => {
        if (state.token) {
            showDashboard();
        } else {
            showAuth();
        }
    });

    // --- API Helper ---
    async function apiCall(endpoint, options = {}) {
        const url = `${API_BASE}${endpoint}`;
        const headers = {
            'Content-Type': 'application/json',
        };
        
        // Add API key for data endpoints if configured
        if (API_KEY && !endpoint.includes('/login') && !endpoint.includes('/register')) {
            headers['X-API-Key'] = API_KEY;
        }

        // We could also add the JWT here if the backend expects it via Authorization header
        // if (state.token && !endpoint.includes('/login') && !endpoint.includes('/register')) {
        //     headers['Authorization'] = `Bearer ${state.token}`;
        // }

        try {
            const response = await fetch(url, { ...options, headers: { ...headers, ...options.headers } });
            
            if (!response.ok) {
                const errorData = await response.json().catch(() => ({}));
                throw new Error(errorData.detail || errorData.message || `HTTP error ${response.status}`);
            }
            
            return await response.json();
        } catch (error) {
            console.error('API Error:', error);
            throw error;
        }
    }

    // --- Auth Functions ---
    function showAuth() {
        document.getElementById('auth-page').classList.remove('hidden');
        document.getElementById('dashboard-page').classList.add('hidden');
    }

    function switchAuthTab(tab) {
        state.activeTab = tab;
        document.getElementById('tab-login').classList.toggle('active', tab === 'login');
        document.getElementById('tab-register').classList.toggle('active', tab === 'register');
        document.getElementById('auth-submit-text').textContent = tab === 'login' ? 'Login' : 'Register';
        document.getElementById('auth-error').textContent = '';
    }

    async function handleAuth(e) {
        e.preventDefault();
        const usernameInput = document.getElementById('auth-username').value;
        const passwordInput = document.getElementById('auth-password').value;
        const errorEl = document.getElementById('auth-error');
        const submitBtn = document.getElementById('auth-submit');
        const spinner = document.getElementById('auth-submit-spinner');
        const submitText = document.getElementById('auth-submit-text');

        errorEl.textContent = '';
        submitBtn.disabled = true;
        spinner.classList.remove('hidden');
        submitText.style.opacity = '0.5';

        const endpoint = state.activeTab === 'login' ? '/api/login' : '/api/register';

        try {
            const data = await apiCall(endpoint, {
                method: 'POST',
                body: JSON.stringify({ username: usernameInput, password: passwordInput })
            });

            if (data.token) {
                state.token = data.token;
                state.username = data.username || usernameInput;
                localStorage.setItem('okf_token', state.token);
                localStorage.setItem('okf_username', state.username);
                showDashboard();
            } else {
                throw new Error('No token received');
            }
        } catch (error) {
            errorEl.textContent = error.message || 'Authentication failed. Please try again.';
        } finally {
            submitBtn.disabled = false;
            spinner.classList.add('hidden');
            submitText.style.opacity = '1';
        }
    }

    function logout() {
        state.token = null;
        state.username = null;
        localStorage.removeItem('okf_token');
        localStorage.removeItem('okf_username');
        document.getElementById('auth-form').reset();
        showAuth();
    }

    // --- Dashboard Functions ---
    async function showDashboard() {
        document.getElementById('auth-page').classList.add('hidden');
        document.getElementById('dashboard-page').classList.remove('hidden');
        document.getElementById('display-username').textContent = state.username;
        
        // Reset view
        document.getElementById('search-input').value = '';
        
        loadStats();
        loadTopics();
        loadRecent();
    }

    async function loadStats() {
        const container = document.getElementById('stats-container');
        try {
            const stats = await apiCall('/api/stats');
            container.innerHTML = `
                <div class="stat-card glass-card slide-up" style="animation-delay: 0.1s">
                    <span class="stat-label">Total Nodes</span>
                    <span class="stat-value">${stats.total_nodes || 0}</span>
                </div>
                <div class="stat-card glass-card slide-up" style="animation-delay: 0.2s">
                    <span class="stat-label">Total Topics</span>
                    <span class="stat-value">${stats.total_topics || 0}</span>
                </div>
                <div class="stat-card glass-card slide-up" style="animation-delay: 0.3s">
                    <span class="stat-label">Latest Update</span>
                    <span class="stat-value" style="font-size: 1.25rem; display: flex; align-items: center; height: 100%;">${formatDate(stats.latest_update) || 'N/A'}</span>
                </div>
            `;
        } catch (error) {
            container.innerHTML = `<div class="error-message" style="grid-column: 1/-1">Failed to load statistics</div>`;
        }
    }

    async function loadTopics() {
        const container = document.getElementById('topics-container');
        container.innerHTML = `<div class="spinner" style="margin: 2rem auto;"></div>`;
        try {
            const topics = await apiCall('/api/topics');
            if (!topics || topics.length === 0) {
                container.innerHTML = `<div class="empty-state" style="padding: 2rem 1rem; font-size: 0.9rem;">No topics found</div>`;
                return;
            }
            
            container.innerHTML = topics.map((t, i) => `
                <div class="topic-card glass-card slide-up" style="animation-delay: ${0.1 * (i%5)}s" onclick="searchByTopic('${t.name}')">
                    <span class="topic-name">${escapeHtml(t.name)}</span>
                    <span class="topic-count">${t.count || 0} nodes</span>
                </div>
            `).join('');
        } catch (error) {
            container.innerHTML = `<div class="error-message">Failed to load topics</div>`;
        }
    }

    async function loadRecent() {
        document.getElementById('main-list-title').textContent = 'Recently Added';
        const container = document.getElementById('main-list-container');
        container.innerHTML = `
            <div class="loading-state">
                <div class="spinner"></div>
                <p>Loading recent nodes...</p>
            </div>
        `;
        
        try {
            const recent = await apiCall('/api/recent?limit=5');
            renderNodeList(recent, container, 'No recent nodes found.');
        } catch (error) {
            container.innerHTML = `<div class="error-message" style="padding: 2rem; text-align: center;">Failed to load recent nodes</div>`;
        }
    }

    // --- Search ---
    function handleSearch(e) {
        const query = e.target.value.trim();
        
        if (state.searchTimeout) {
            clearTimeout(state.searchTimeout);
        }

        if (query === '') {
            loadRecent();
            return;
        }

        state.searchTimeout = setTimeout(() => {
            performSearch(query);
        }, 300);
    }

    function searchByTopic(topic) {
        const searchInput = document.getElementById('search-input');
        // Simple convention for topic search if backend supports it, otherwise generic search
        searchInput.value = `topic:"${topic}"`; 
        performSearch(`topic:"${topic}"`);
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    async function performSearch(query) {
        document.getElementById('main-list-title').textContent = `Search Results for "${query}"`;
        const container = document.getElementById('main-list-container');
        container.innerHTML = `
            <div class="loading-state">
                <div class="spinner"></div>
                <p>Searching...</p>
            </div>
        `;

        try {
            const results = await apiCall(`/api/search?q=${encodeURIComponent(query)}&limit=10`);
            renderNodeList(results, container, 'No results found matching your query.');
        } catch (error) {
            container.innerHTML = `<div class="error-message" style="padding: 2rem; text-align: center;">Search failed. Please try again.</div>`;
        }
    }

    function renderNodeList(nodes, container, emptyMessage) {
        if (!nodes || nodes.length === 0) {
            container.innerHTML = `<div class="empty-state">${emptyMessage}</div>`;
            return;
        }

        container.innerHTML = nodes.map((n, i) => {
            const rankHtml = n.rank ? `
                <div class="rank-bar" title="Relevance Score: ${Math.round(n.rank * 100)}%">
                    <div class="rank-fill" style="width: ${Math.min(100, n.rank * 100)}%"></div>
                </div>
            ` : '';
            
            const tagsHtml = (n.tags || []).map(tag => `<span class="badge badge-tag">${escapeHtml(tag)}</span>`).join('');
            const typeBadge = n.type ? `<span class="badge badge-type">${escapeHtml(n.type)}</span>` : '';
            const topicBadge = n.topic ? `<span class="badge badge-topic">${escapeHtml(n.topic)}</span>` : '';

            return `
                <div class="node-card glass-card slide-up" style="animation-delay: ${0.05 * i}s" onclick="openNode('${n.slug}')">
                    <div class="node-header">
                        <div class="node-title">${escapeHtml(n.title || 'Untitled Node')}</div>
                        <div style="font-size: 0.8rem; color: var(--text-secondary);">${formatDate(n.timestamp)}</div>
                    </div>
                    <div class="node-desc">${escapeHtml(n.description || 'No description available.')}</div>
                    <div class="node-meta">
                        ${topicBadge}
                        ${typeBadge}
                        ${tagsHtml}
                    </div>
                    ${rankHtml}
                </div>
            `;
        }).join('');
    }

    // --- Node Detail Modal ---
    async function openNode(slug) {
        const modal = document.getElementById('node-modal');
        const content = document.getElementById('modal-body-content');
        
        modal.classList.add('active');
        document.body.style.overflow = 'hidden';
        
        content.innerHTML = `
            <div class="loading-state" style="padding: 6rem 2rem;">
                <div class="spinner"></div>
                <p>Loading node details...</p>
            </div>
        `;

        try {
            const node = await apiCall(`/api/nodes/${slug}`);
            
            const tagsHtml = (node.tags || []).map(tag => `<span class="badge badge-tag">${escapeHtml(tag)}</span>`).join('');
            const typeBadge = node.type ? `<span class="badge badge-type">${escapeHtml(node.type)}</span>` : '';
            const topicBadge = node.topic ? `<span class="badge badge-topic">${escapeHtml(node.topic)}</span>` : '';
            
            let sourceInfo = '';
            if (node.source_doc) {
                sourceInfo = `Source: <strong>${escapeHtml(node.source_doc)}</strong>`;
                if (node.pages) {
                    sourceInfo += ` (Pages: ${escapeHtml(node.pages)})`;
                }
            }

            content.innerHTML = `
                <div class="fade-in">
                    <h1 class="modal-title">${escapeHtml(node.title || 'Untitled Node')}</h1>
                    <div class="modal-meta-row">
                        ${topicBadge}
                        ${typeBadge}
                        ${tagsHtml}
                        <span style="color: var(--text-secondary); font-size: 0.9rem; margin-left: auto;">
                            Added: ${formatDate(node.timestamp)}
                        </span>
                    </div>
                    ${sourceInfo ? `<div class="modal-source-info">${sourceInfo}</div>` : ''}
                    <div class="modal-text-content">${escapeHtml(node.content || 'No content available.')}</div>
                </div>
            `;
        } catch (error) {
            content.innerHTML = `
                <div class="empty-state">
                    <h3 style="color: var(--error); margin-bottom: 1rem;">Failed to load node</h3>
                    <p>${escapeHtml(error.message)}</p>
                    <button class="btn-secondary" style="margin-top: 1rem;" onclick="closeModal()">Close</button>
                </div>
            `;
        }
    }

    function closeModal(e) {
        if (e && e.target !== document.getElementById('node-modal') && e.target !== document.querySelector('.modal-close')) {
            return;
        }
        document.getElementById('node-modal').classList.remove('active');
        document.body.style.overflow = '';
    }

    // --- Utilities ---
    function escapeHtml(unsafe) {
        if (!unsafe) return '';
        return String(unsafe)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }

    function formatDate(dateStr) {
        if (!dateStr) return '';
        const d = new Date(dateStr);
        if (isNaN(d.getTime())) return dateStr;
        return d.toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' });
    }
</script>
</body>
</html>
